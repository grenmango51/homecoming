# ==============================================================================
# FLIGHT TRACKER GENERAL CONFIGURATION
# Execution, browser, scraping, and platform settings.
# Route & date parameters are loaded from modular trip files (see trip_file below).
# ==============================================================================

# Active trip configuration file (name or path inside config/ directory, or relative to project root)
# Examples: "HEL_HAN.toml", "PHL_HAN.toml"
trip_file = "HEL_HAN.toml"

[execution]
# Execution strategy:
# - "parallel": Run both Google Flights and Skyscanner scrapers at the same time
# - "sequential": Run Google Flights first, then Skyscanner
strategy = "parallel"

# Skip querying pairs already observed today (enables fast resuming if interrupted)
skip_existing = true

# Automatically run cross-platform price comparison report once scraping finishes
auto_compare = true

# Optional path to local Chrome or Edge executable. Leave empty to auto-detect.
browser_executable = ""

# Maximum per-scraper runtime budget in seconds (default 1800 = 30 minutes)
runtime_budget_seconds = 1800

[google_flights]
# Whether to run Google Flights in the unified execution
enabled = true

# Point of sale country code(s) (e.g. ["FI", "SE"] to scan both Finland and Sweden)
gl = ["FI", "SE"]

# Delay between page loads in seconds
delay_seconds = 3

# Page load timeout in seconds
timeout_seconds = 30

# Dedicated browser profile directory (relative to project root).
# Lives under var/profiles/ so the project root stays clean.
profile_dir = "var/profiles/google"

# Results output directory (relative to project root)
results_dir = "flight_results"

# Delete Chromium cache folders after each run (cookies and consent state are kept)
prune_cache = true

# Profile mode: "ephemeral" (default) uses a temporary profile deleted when
# the browser closes — consent cookies are re-seeded on every launch, so no
# state is needed and no profile folder is kept. "persistent" keeps a saved
# profile under profile_dir.
profile_mode = "ephemeral"

[skyscanner]
# Whether to run Skyscanner in the unified execution
enabled = true

# Delay between searches in seconds
delay_seconds = 12

# Page load timeout in seconds
timeout_seconds = 45

# Wait time in seconds for Skyscanner to poll all OTA and airline providers
poll_wait_seconds = 30

# Whether to run in attended mode (waiting for human intervention on anti-bot challenges)
attended = false

# Wait time in seconds if manual challenge / CAPTCHA solving is required (used when attended = true)
challenge_timeout_seconds = 0

# Dedicated browser profile directory (relative to project root).
# Persistent: holds the bot-check clearance cookies between runs.
# Kept at the project root: moving it under var/profiles/ on 2026-09-27
# coincided with a large increase in anti-bot challenges, so it was rolled back.
profile_dir = ".skyscanner-profile-stealth"

# Results output directory (relative to project root)
results_dir = "flight_results_skyscanner"

# Delete Chromium cache folders after each run (cookies and bot-check clearance are kept)
prune_cache = true

[comparison]
# Directory where the cross-platform comparison reports will be saved
output_dir = "flight_results"
