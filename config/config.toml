# ==============================================================================
# FLIGHT TRACKER GENERAL CONFIGURATION
# Execution, browser, scraping, and platform settings.
# Route & date parameters are loaded from modular trip files (see trip_file below).
# ==============================================================================

# Active trip configuration file (name or path inside config/ directory, or relative to project root)
# Examples: "HEL_HAN.toml", "PHL_HAN.toml"
trip_file = "HEL_HAN.toml"

[execution]
# Execution strategy:
# - "parallel": Run both Google Flights and Skyscanner scrapers at the same time
# - "sequential": Run Google Flights first, then Skyscanner
strategy = "parallel"

# Skip querying pairs already observed today (enables fast resuming if interrupted)
skip_existing = true

# Automatically run cross-platform price comparison report once scraping finishes
auto_compare = true

# Optional path to local Chrome or Edge executable. Leave empty to auto-detect.
browser_executable = ""

[google_flights]
# Whether to run Google Flights in the unified execution
enabled = true

# Point of sale country code (e.g. "SE" for Sweden, "FI" for Finland, "DE" for Germany)
gl = "FI"

# Delay between page loads in seconds
delay_seconds = 3

# Page load timeout in seconds
timeout_seconds = 30

# Dedicated browser profile directory (relative to project root)
profile_dir = ".browser-profile-daily"

# Results output directory (relative to project root)
results_dir = "flight_results"

[skyscanner]
# Whether to run Skyscanner in the unified execution
enabled = true

# Delay between searches in seconds
delay_seconds = 10

# Page load timeout in seconds
timeout_seconds = 45

# Wait time in seconds for Skyscanner to poll all OTA and airline providers
poll_wait_seconds = 30

# Wait time in seconds if manual challenge / CAPTCHA solving is required
challenge_timeout_seconds = 120

# Dedicated browser profile directory (relative to project root)
profile_dir = ".skyscanner-profile"

# Results output directory (relative to project root)
results_dir = "flight_results_skyscanner"

[comparison]
# Directory where the cross-platform comparison reports will be saved
output_dir = "flight_results"
